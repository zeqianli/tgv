[package]
name = "tgv"
version = "0.3.0"
edition = "2024"
description = "Explore genomes in the terminal. Light, blazing fast 🚀, vim-motion."
license = "MIT"
rust-version = "1.88"
include = ["src/*", "!src/snapshots", "Cargo.toml", "./README.md"]

[dependencies]
clap.workspace = true
# The event loop waits for terminal events and session requests together.
crossterm = { workspace = true, features = ["event-stream"] }
futures.workspace = true
gv-core.workspace = true
gv-mcp.workspace = true
gv-session.workspace = true
itertools.workspace = true
log.workspace = true
miette.workspace = true
ratatui.workspace = true
serde.workspace = true
shellexpand.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
noodles.workspace = true
polars.workspace = true
unicode-width.workspace = true

[[bench]]
name = "render_bench"
path = "bench/render_bench.rs"
# A headless timing binary that takes its own arguments instead of using libtest.
harness = false

[dev-dependencies]
insta = "1.42"
rstest = "0.25.0"
serde_json.workspace = true
shlex = "1.3.0"
tempfile = "3"
