name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - test

jobs:
  build-linux-musl:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
          shared-key: x86_64-unknown-linux-musl

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libssl-dev pkg-config libz-dev

      - name: Build
        run: cargo build -p tgv --release --target x86_64-unknown-linux-musl

      - name: Prepare binary
        run: |
          mkdir -p dist
          tar czvf dist/tgv-x86_64-linux-musl.tar.gz -C target/x86_64-unknown-linux-musl/release tgv
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgv-linux-musl
          path: dist/tgv-x86_64-linux-musl.tar.gz

  build-macos-arm:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin
          shared-key: aarch64-apple-darwin

      - name: Build
        run: cargo build -p tgv --release --target aarch64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p dist
          tar czvf dist/tgv-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release tgv
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgv-macos-arm
          path: dist/tgv-aarch64-apple-darwin.tar.gz

  build-gui-linux-gnu:
    name: Build Linux GUI release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          shared-key: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev

      - name: Build
        run: cargo build -p tgv-gui --release --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p dist
          tar czvf dist/tgv-gui-x86_64-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release tgv-gui
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgv-gui-linux-gnu
          path: dist/tgv-gui-x86_64-linux-gnu.tar.gz

  build-gui-macos-arm:
    name: Build macOS GUI release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-aarch64-apple-darwin
          shared-key: gui-aarch64-apple-darwin

      - name: Build
        run: cargo build -p tgv-gui --release --target aarch64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p dist
          tar czvf dist/tgv-gui-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release tgv-gui
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgv-gui-macos-arm
          path: dist/tgv-gui-aarch64-apple-darwin.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-musl
      - build-macos-arm
      - build-gui-linux-gnu
      - build-gui-macos-arm
    outputs:
      version: ${{ steps.release_info.outputs.VERSION }}
      tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
      release_name: ${{ steps.release_info.outputs.RELEASE_NAME }}
      is_prerelease: ${{ steps.release_info.outputs.IS_PRERELEASE }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum *tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release-files/checksums.txt

      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Workflow dispatch (manual) - use nightly or test release
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            CURRENT_DATE=$(date +'%Y%m%d')
            echo "VERSION=${RELEASE_TYPE}-${CURRENT_DATE}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=${RELEASE_TYPE^} Build (${CURRENT_DATE})" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${RELEASE_TYPE}-${CURRENT_DATE}" >> $GITHUB_OUTPUT
          else
            # Tag-based release
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=v${VERSION}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create tag for nightly/test build
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag ${{ steps.release_info.outputs.TAG_NAME }}
          git push origin ${{ steps.release_info.outputs.TAG_NAME }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.RELEASE_NAME }}
          files: release-files/*
          draft: false
          prerelease: ${{ steps.release_info.outputs.IS_PRERELEASE }}
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    if: github.event_name == 'push' && needs.create-release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
    steps:
      - name: Download checksums artifact
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: .

      - name: Extract checksums
        id: checksums
        run: |
          set -euo pipefail
          echo "Parsing checksums from checksums.txt"
          sha_of() { awk -v f="$1" '$2 == f { print $1 }' checksums.txt; }
          DARWIN_SHA=$(sha_of tgv-aarch64-apple-darwin.tar.gz)
          LINUX_SHA=$(sha_of tgv-x86_64-linux-musl.tar.gz)
          GUI_DARWIN_SHA=$(sha_of tgv-gui-aarch64-apple-darwin.tar.gz)
          GUI_LINUX_SHA=$(sha_of tgv-gui-x86_64-linux-gnu.tar.gz)
          test -n "${DARWIN_SHA}"
          test -n "${LINUX_SHA}"
          test -n "${GUI_DARWIN_SHA}"
          test -n "${GUI_LINUX_SHA}"
          echo "DARWIN_SHA=${DARWIN_SHA}" >> $GITHUB_OUTPUT
          echo "LINUX_SHA=${LINUX_SHA}" >> $GITHUB_OUTPUT
          echo "GUI_DARWIN_SHA=${GUI_DARWIN_SHA}" >> $GITHUB_OUTPUT
          echo "GUI_LINUX_SHA=${GUI_LINUX_SHA}" >> $GITHUB_OUTPUT
          echo "Darwin SHA: $DARWIN_SHA"
          echo "Linux SHA: $LINUX_SHA"
          echo "GUI Darwin SHA: $GUI_DARWIN_SHA"
          echo "GUI Linux SHA: $GUI_LINUX_SHA"

      - name: Checkout Homebrew Tap Repo
        uses: actions/checkout@v4
        with:
          repository: zeqianli/homebrew-tgv
          path: homebrew-repo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Update Formula File
        working-directory: homebrew-repo
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          DARWIN_SHA="${{ steps.checksums.outputs.DARWIN_SHA }}"
          LINUX_SHA="${{ steps.checksums.outputs.LINUX_SHA }}"
          GUI_DARWIN_SHA="${{ steps.checksums.outputs.GUI_DARWIN_SHA }}"
          GUI_LINUX_SHA="${{ steps.checksums.outputs.GUI_LINUX_SHA }}"
          TEMPLATE_FILE="${{ github.workspace }}/.github/workflows/brew_template.tgv.rb"
          FORMULA_FILE="Formula/tgv.rb"

          test -n "${VERSION}"
          test -n "${DARWIN_SHA}"
          test -n "${LINUX_SHA}"
          test -n "${GUI_DARWIN_SHA}"
          test -n "${GUI_LINUX_SHA}"
          test -f "${TEMPLATE_FILE}"

          echo "Updating $FORMULA_FILE using template $TEMPLATE_FILE"

          cp "$TEMPLATE_FILE" "$FORMULA_FILE"

          sed -i.bak "s|__VERSION__|${VERSION}|g" "$FORMULA_FILE"
          sed -i.bak "s|__GUI_MACOS_SHA256__|${GUI_DARWIN_SHA}|g" "$FORMULA_FILE"
          sed -i.bak "s|__GUI_LINUX_SHA256__|${GUI_LINUX_SHA}|g" "$FORMULA_FILE"
          sed -i.bak "s|__MACOS_SHA256__|${DARWIN_SHA}|g" "$FORMULA_FILE"
          sed -i.bak "s|__LINUX_SHA256__|${LINUX_SHA}|g" "$FORMULA_FILE"

          rm -f "${FORMULA_FILE}.bak"

          if grep -q '__[A-Z_]*__' "$FORMULA_FILE"; then
            echo "Unreplaced placeholders in $FORMULA_FILE"
            exit 1
          fi

          echo "Formula file updated from template:"
          cat "$FORMULA_FILE"

      - name: Create Homebrew Tap PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-repo
          add-paths: |
            Formula/tgv.rb
          commit-message: "chore: Update tgv formula to v${{ needs.create-release.outputs.version }}"
          branch: "update-tgv-v${{ needs.create-release.outputs.version }}"
          base: main
          delete-branch: true
          title: "Update tgv formula to v${{ needs.create-release.outputs.version }}"
          body: |
            Update tgv formula to version `${{ needs.create-release.outputs.version }}`.

            **Checksums:**
            - macOS (ARM): `${{ steps.checksums.outputs.DARWIN_SHA }}`
            - Linux (musl): `${{ steps.checksums.outputs.LINUX_SHA }}`
            - GUI macOS (ARM): `${{ steps.checksums.outputs.GUI_DARWIN_SHA }}`
            - GUI Linux (GNU): `${{ steps.checksums.outputs.GUI_LINUX_SHA }}`
