[workspace]
members = ["crates/gv-core", "crates/gv-mcp", "crates/gv-session", "crates/gv-gui", "crates/gv-hgvs", "crates/gv-viewer", "crates/tgv"]
resolver = "3"

[workspace.dependencies]
# Non-local crates

async-compat = "0"
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
async-trait = "0"
# Objective-C blocks, for the GUI's macOS event monitor. The version gpui uses.
block = "0.1"
bigtools = { version = "0", default-features = false, features = ["read"] }
chrono = { version = "0", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
# Match the versions ratatui uses, so the TUI shares one copy of each.
crossterm = "0.28"
futures = "0"
# HGVS parsing, projection, and reference preparation. The default features are already minimal;
# `protein-fetch` stays off so the viewer never fetches proteins over the network at runtime.
ferro-hgvs = { version = "1", default-features = false }
# The GUI's UI framework. Only `gv-gui` depends on it, so the `tgv` binary stays free of it.
# Metal shaders compile when the app starts, so building doesn't need Xcode's Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
itertools = "0.13"
# Bounded caches, such as HGVS annotations for hovered variants.
lru = "0.12"
log = { version = "0.4", features = ["std"] }
# Objective-C messages, for the GUI's macOS event monitor. The version gpui uses.
objc = "0.2"
noodles = { version = "0", features = ["async", "bam", "bcf", "bed", "bgzf", "core", "cram", "csi", "fasta", "sam", "tabix", "vcf"] }
opendal = { version = "0.53", default-features = false, features = ["services-s3"] }
# Polars 0.55 string expressions also require its temporal support. Crates that run SQL add
# their features in their own manifests.
polars = { version = "0.55", default-features = false, features = ["dtype-u8", "dtype-u16", "lazy", "strings", "is_in", "cum_agg", "dtype-i128", "temporal", "round_series"] }
ratatui = "0.29"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
shellexpand = "3.1"
shlex = "1.3.0"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "sqlite", "runtime-tokio", "tls-rustls"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = { version = "2" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
twobit = "0"
unicode-width = "0.2"

# local crates

gv-core = { path = "crates/gv-core", version = "=0.4.0" }
gv-hgvs = { path = "crates/gv-hgvs", version = "=0.4.0" }
gv-mcp = { path = "crates/gv-mcp", version = "=0.4.0" }
gv-session = { path = "crates/gv-session", version = "=0.4.0" }
gv-viewer = { path = "crates/gv-viewer", version = "=0.4.0" }

[profile.dev]
# Full debug info for Polars and noodles makes each test binary about 2 GB, so linking
# dominates test builds. Line tables keep file and line numbers in backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies don't need debug info for stepping through TGV code.
debug = false

# Preparing and loading HGVS data decompresses and parses gigabytes of FASTA and JSON, which takes
# hours unoptimized. Optimizing these dependencies keeps debug builds and tests usable.
[profile.dev.package.ferro-hgvs]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.rkyv]
opt-level = 3

[profile.release] # as recommended in https://github.com/ratatui/ratatui-website/pull/931/files
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables link-time optimization.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.
